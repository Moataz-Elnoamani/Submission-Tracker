# Secrets — set with `npx wrangler secret put <NAME>`, never written here:
#   OPUS_BASE_URL          e.g. https://opus-operator.<your-domain>
#   OPUS_SERVICE_KEY       Opus x-service-key
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN   needs Sheets read/write + Gmail send scopes
#   MANAGER_PASSCODE       what managers type into the portal
#   TOKEN_SECRET           any long random string (signs manager sessions)
