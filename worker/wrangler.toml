name = "mn-portal-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Run log for the manager view. Create it once with:
#   npx wrangler kv namespace create RUNS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "RUNS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Not secret — safe to commit.
WORKFLOW_ID = "23a4ac11-3fe8-4172-a317-4422e8040de6"
SPREADSHEET_ID = "1GeML664hQhkxUZIptoNh2SdvzVnaXOLtkURDh6kbQ18"
# Your GitHub Pages origin (no trailing slash). Comma-separate several; "*" allows all.
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USER.github.io"
MANAGER_EMAIL = "nada.elasraby@aaico.com"
# Optional: map Workflow Output IDs so the portal can show where the entry landed.
# Fill in after you map the Output node (see README → "Recommended workflow change").
OUTPUT_MAP = '{}'
